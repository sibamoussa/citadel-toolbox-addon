apiVersion: citadel.microsoft.com/v1alpha1
kind: ToolboxBundle
metadata:
  name: citadel-core
  description: Governed enterprise tools and skills for Citadel agents.
  version: 0.1.0

tools:
  - id: enterprise-knowledge
    enabled: true
    risk: read
    provider:
      type: azure_ai_search
      project_connection_id: ${AZURE_AI_SEARCH_CONNECTION_ID}
      index_name: ${AZURE_AI_SEARCH_INDEX_NAME}
      query_type: vector_semantic_hybrid
      top_k: 5

  - id: employee-context
    enabled: false
    risk: read
    preview: true
    constraints:
      network_isolation: unsupported
      identity: delegated-user
    provider:
      type: work_iq_preview
      project_connection_id: ${WORK_IQ_PROJECT_CONNECTION_ID}

  - id: government-systems
    enabled: true
    risk: read
    provider:
      type: mcp
      server_label: government-systems
      server_url: ${GOVERNMENT_SYSTEMS_MCP_URL}
      project_connection_id: ${GOVERNMENT_SYSTEMS_MCP_CONNECTION_ID}
      require_approval: never
      tool_configs:
        "*":
          additional_search_text: HR finance CRM ERP cases applications status government services

  - id: approved-web-search
    enabled: true
    risk: read
    provider:
      type: web_search
      filters:
        allowed_domains:
          - ${APPROVED_WEB_DOMAIN}
      require_approval: never

  - id: workflow-actions
    enabled: false
    risk: write
    require_approval: always
    provider:
      type: mcp
      server_label: government-actions
      server_url: ${GOVERNMENT_ACTIONS_MCP_URL}
      project_connection_id: ${GOVERNMENT_ACTIONS_MCP_CONNECTION_ID}
      tool_configs:
        "*":
          additional_search_text: submit create update request ticket application workflow transaction

  - id: tool-discovery
    enabled: true
    risk: read
    provider:
      type: toolbox_search

skills:
  - id: enterprise-grounding
    enabled: true
    path: skills/enterprise-grounding/SKILL.md
  - id: government-service-routing
    enabled: true
    path: skills/government-service-routing/SKILL.md
  - id: safe-transaction
    enabled: true
    path: skills/safe-transaction/SKILL.md
