metadata:
  name: example-entity-toolbox
  description: Shared Citadel capabilities customized for Example Entity.

tools:
  - id: enterprise-knowledge
    provider:
      project_connection_id: ${EXAMPLE_SEARCH_CONNECTION_ID}
      index_name: ${EXAMPLE_SEARCH_INDEX_NAME}
      filter: "entity_id eq 'example'"

  - id: employee-context
    enabled: false
