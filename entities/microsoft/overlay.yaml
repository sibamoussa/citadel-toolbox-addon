metadata:
  name: microsoft-toolbox
  description: Shared Citadel capabilities customized for Microsoft.

tools:
  - id: enterprise-knowledge
    provider:
      project_connection_id: ${MICROSOFT_SEARCH_CONNECTION_ID}
      index_name: ${MICROSOFT_SEARCH_INDEX_NAME}

  - id: employee-context
    enabled: true

  - id: foundry-iq
    enabled: true
    risk: read
    provider:
      type: mcp
      server_label: foundry-iq
      server_url: ${MICROSOFT_FOUNDRY_IQ_MCP_URL}
      project_connection_id: ${MICROSOFT_FOUNDRY_IQ_CONNECTION_ID}
      require_approval: never

  - id: tool-discovery
    enabled: true

skills:
  - id: workplace-context
    enabled: true
    path: skills/workplace-context/SKILL.md
