name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m ruff check .
      - run: python -m pytest
      - run: citadel-toolbox compile --overlay entities/example/overlay.yaml --output generated/example/toolbox.yaml --allow-unresolved