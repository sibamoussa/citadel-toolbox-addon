[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citadel-toolbox-addon"
version = "0.1.0"
description = "Customizable Microsoft Foundry Toolbox add-on for Citadel deployments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Citadel Toolbox Contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
citadel-toolbox = "citadel_toolbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citadel_toolbox"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]